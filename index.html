<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronell Nicor</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #092244, #04102D);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    text-align: center;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 12px;
    color: #287BE8;
    font-weight: bold;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 6px 0;
    color: #092244;
    font-size: 28px;
  }
  .role {
    color: #737373;
    font-size: 16px;
    margin-bottom: 20px;
  }
  .message {
    color: #0A0A0A;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .contact {
    display: inline-block;
    background: #092244;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Service Delivery Operations</div>
    <h1>Ronell Nicor</h1>
    <div class="role">Service Delivery Operations Manager</div>
    <div class="message">
      I keep our service delivery running smoothly, so our team can focus on doing great work without operational friction getting in the way.
    </div>
    <div class="contact">Reach out anytime</div>
  </div>
</body>
</html>
